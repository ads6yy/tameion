[project]
name = "tameion"
version = "0.1.0"
description = "Squelette : grand livre beancount + paiements USDC sur Arc testnet"
requires-python = ">=3.12"
dependencies = [
    "beancount>=3.2.3",
    "web3>=8.0.0",
]

[project.scripts]
tameion = "tameion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tameion"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
